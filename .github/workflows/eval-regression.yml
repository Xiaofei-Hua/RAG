name: Evaluation Regression Gate

# Runs the golden evaluation suite and blocks the PR if any trustworthy metric
# regresses beyond its threshold vs. the latest baseline.
#
# Two modes:
#   - CI (default): rule-based scoring only (--no-judge), so it runs without a
#     local LLM. This catches structural regressions (section/keyword/intent/
#     source coverage) cheaply on every PR.
#   - Nightly / self-hosted: enable the judge by setting EVAL_USE_JUDGE=true
#     and pointing at an Ollama endpoint (OLLAMA_BASE_URL). This catches
#     faithfulness / hallucination regressions that rule-based checks miss.
#
# On main pushes the run is saved as the new baseline (the latest summary on
# the dataset is automatically picked as the baseline by --fail-on-regression).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_judge:
        description: "Enable LLM-as-judge (needs Ollama)"
        required: false
        default: "false"
  schedule:
    # Nightly judge-enabled run (only meaningful on a self-hosted runner).
    - cron: "0 2 * * *"

jobs:
  eval:
    runs-on: ${{ github.event_name == 'schedule' && 'self-hosted' || 'ubuntu-latest' }}
    env:
      EVAL_USE_JUDGE: ${{ (github.event_name == 'schedule' || github.event.inputs.use_judge == 'true') && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml numpy
          pip install langchain-core langchain-openai

      - name: Run evaluation (rule-based, CI)
        if: env.EVAL_USE_JUDGE != 'true'
        run: |
          python scripts/run_eval.py \
            --tag ci \
            --no-judge \
            --concurrency 8

      - name: Run evaluation (with judge, nightly/self-hosted)
        if: env.EVAL_USE_JUDGE == 'true'
        env:
          OPENAI_BASE_URL: ${{ secrets.OLLAMA_BASE_URL || 'http://localhost:11434/v1' }}
          OPENAI_API_KEY: ollama
          LLM_MODEL: ${{ secrets.EVAL_LLM_MODEL || 'qwen3:14b' }}
        run: |
          python scripts/run_eval.py \
            --tag nightly \
            --concurrency 4

      - name: Regression gate
        if: github.event_name == 'pull_request'
        run: |
          python scripts/run_eval.py \
            --tag ci \
            --no-judge \
            --fail-on-regression \
            --concurrency 8 || exit 1

      - name: Upload eval run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-run-${{ github.run_id }}
          path: data/eval/runs/
          if-no-files-found: warn
          retention-days: 30
