name: API-Only Docker Image

# Builds the torch-less API-only image and enforces the < 4 GB size budget
# (REQ-AO-002). The image is NOT built in tests.yml (which runs the local-models
# profile); this job owns the API-only profile gate.
# See docs/specs/api-only-deploy/design.md §4 / F-10.

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - models/dashscope_embeddings.py
      - models/embedding_models.py
      - utils/env_utils.py
      - .github/workflows/docker-api-only.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

jobs:
  build-and-size-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API-only image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: rag-platform:api-only-ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert image size < 4 GB (REQ-AO-002)
        # The hard requirement for the mirrored/airgapped deployment target.
        # 4 GB = 4294967296 bytes. A failure here must block the PR.
        run: |
          set -euo pipefail
          SIZE_BYTES=$(docker image inspect rag-platform:api-only-ci \
            --format '{{.Size}}')
          SIZE_GB=$(python3 -c "print(f'{$SIZE_BYTES/1024**3:.3f}')")
          echo "Image size: ${SIZE_GB} GB (${SIZE_BYTES} bytes)"
          LIMIT_BYTES=4294967296
          if [ "$SIZE_BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "::error::Image ${SIZE_GB} GB exceeds the 4 GB budget (REQ-AO-002). \
          Trim deps (check `docker history rag-platform:api-only-ci`) or move more \
          into the local-models extra."
            exit 1
          fi
          echo "::notice::Image ${SIZE_GB} GB is within the 4 GB budget."

      - name: Assert no torch / sentence-transformers in image (REQ-AO-001)
        # Defensive: confirms the dep restructure actually excluded torch from
        # the api-only profile (F-10 closure).
        run: |
          set -euo pipefail
          # Run inside the image's own venv via the same uv entrypoint as CMD.
          LEAKS=$(docker run --rm --entrypoint uv \
            rag-platform:api-only-ci pip list 2>/dev/null \
            | grep -iE '^(torch|sentence-transformers|transformers|langchain-huggingface)\s' || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::Torch stack leaked into the api-only image:"
            echo "$LEAKS"
            exit 1
          fi
          echo "::notice::No torch stack present in the api-only image."
