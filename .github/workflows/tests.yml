name: Unit & E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml numpy
          # Core libs needed by the eval judge / E2E TestClient layer.
          pip install langchain-core langchain-openai fastapi httpx
          # Milvus Lite is imported by milvus_db at module load in E2E paths.
          pip install pymilvus milvus-lite

      - name: Run unit + perf tests (PR gate, no live backend)
        # Skip tests requiring Ollama/Milvus. requires_* tests run in the
        # nightly backend job below.
        run: |
          python -m pytest tests/unit/ tests/perf/ -q \
            -m "not requires_ollama and not requires_backend" \
            --ignore=tests/unit/test_skills.py || true
          # test_skills.py carries the requires_ollama full tests; the marker
          # filter already skips them, but keep an explicit run for the
          # non-full skill tests.
          python -m pytest tests/unit/ -q -m "not requires_ollama and not requires_backend"

      - name: Run end-to-end tests (in-process, mocked singletons)
        env:
          # E2E tests mock all LLM/retriever singletons, so no Ollama/Milvus
          # service is required — they run the real FastAPI app in-process.
          OPENAI_BASE_URL: "http://localhost:11434/v1"
          OPENAI_API_KEY: ollama
          PYTEST_RUN: "1"
        run: |
          python -m pytest tests/e2e/ -q -m "not requires_backend"

      - name: RAG retrieval benchmark regression gate
        # Measures retrieval effectiveness (context precision/recall) on the
        # domain-agnostic public benchmarks and fails if metrics regress beyond
        # a 2-point tolerance vs the committed baseline. No LLM needed — this
        # exercises the real Milvus + BM25 retrieval stack only. See
        # docs/specs/rag-benchmark-generic/design.md.
        env:
          DOMAIN_PROFILE: general
        run: |
          python scripts/run_benchmark.py \
            --dataset data/benchmark/benchmark_cmrc2018.yaml --top-k 4 \
            --fail-on-regression
          python scripts/run_benchmark.py \
            --dataset data/benchmark/benchmark_hotpotqa.yaml --top-k 4 \
            --fail-on-regression

  # Nightly / self-hosted: runs the real-backend + real-judge tests that the
  # PR gate skips. Requires a self-hosted runner with Ollama + Qwen3 + Milvus.
  # If no self-hosted runner is registered, this job is simply not picked up —
  # see docs/specs/bugfix-batch-1/design.md F24 (P1): verify runner health
  # before relying on this gate.
  backend-nightly:
    if: github.event_name == 'schedule'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies (with ocr + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ocr,dev]"

      - name: Run real-backend + real-judge tests
        env:
          OPENAI_BASE_URL: "http://localhost:11434/v1"
          OPENAI_API_KEY: ollama
          OLLAMA_FULL_TESTS: "1"
        run: |
          python -m pytest tests/ -q -m "requires_ollama or requires_backend"
