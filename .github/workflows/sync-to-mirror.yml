name: Sync to Mirror Repo

on:
  push:
    branches:
      - '*'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SYNC_DEPLOY_KEY }}
          known_hosts: github.com

      - name: Push to mirror
        run: |
          git remote add mirror git@github.com:PHMgogooo/RAG.git
          git push mirror --all --force
          git push mirror --tags --force
