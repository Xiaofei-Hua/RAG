name: Sync to Mirror Repo

# Temporarily disabled for Q1 (docs/specs/engineering-governance-optimization):
# git filter-repo rewrites history below, and this workflow's `push: branches:
# ['*']` + `git push mirror --all --force` would race the rewrite — pushing
# the pre-rewrite history back to phm mid-operation. The guard below keeps
# the workflow syntactically valid but never triggers. It is re-enabled in
# the final Q1 commit once both remotes are rewritten and consistent.
on:
  push:
    branches:
      - 'never-match-this-branch-name'
  workflow_dispatch:

jobs:
  sync:
    if: github.repository == 'never-match-this-repo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SYNC_DEPLOY_KEY }}
          known_hosts: github.com

      - name: Push to mirror
        run: |
          git remote add mirror git@github.com:PHMgogooo/RAG.git
          git push mirror --all --force
          git push mirror --tags --force
