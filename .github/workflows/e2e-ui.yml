name: Playwright UI E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (backend)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node (frontend + Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend deps (minimal; e2e fakes replace LLM/Milvus)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml numpy langchain-core langchain-openai \
            fastapi httpx pymilvus milvus-lite

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          PYTEST_RUN: "1"
          RAG_E2E_FAKES: "1"
          OPENAI_BASE_URL: "http://localhost:11434/v1"
          OPENAI_API_KEY: ollama
        run: npx playwright test --config=web/playwright.config.ts
