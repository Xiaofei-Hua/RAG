name: Playwright UI E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # uv for the backend (AGENTS.md §5). The previous hand-maintained pip
      # subset could drift from pyproject.toml the same way tests.yml's did
      # (dropping loguru); installing from uv.lock removes that risk.
      - name: Set up uv (backend)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Set up Node (frontend + Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend deps (e2e fakes replace LLM/Milvus)
        run: uv sync --frozen --extra dev

      - name: Build frontend
        run: |
          npm ci
          npm run build

      # Q8: eslint non-blocking baseline (first-time enablement). Surfaces
      # lint issues without failing the job; the web/ codebase predates this
      # config. Tightening path: fix the baseline warnings, then drop
      # continue-on-error.
      - name: Lint (eslint, non-blocking baseline)
        continue-on-error: true
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          PYTEST_RUN: "1"
          RAG_E2E_FAKES: "1"
          OPENAI_BASE_URL: "http://localhost:11434/v1"
          OPENAI_API_KEY: ollama
        run: npx playwright test --config=web/playwright.config.ts
